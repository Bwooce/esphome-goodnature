esphome:
  name: goodnature_ble_monitor
  platform: ESP32
  board: esp32dev

wifi:
  ssid: "Your_WiFi_SSID"
  password: "Your_WiFi_Password"

# Enable Home Assistant API
api:

# Enable OTA updates
ota:

# Enable logging
logger:
  level: DEBUG  # Change to INFO after testing
  logs:
    esp32_ble_tracker: DEBUG  # See all BLE devices
    goodnature_ble: DEBUG     # See iBeacon parsing details

# Enable Web server
web_server:
  port: 80

# Enable Bluetooth Low Energy
esp32_ble_tracker:

# Sensor configuration for Goodnature trap
# Now with proper iBeacon parsing!
sensor:
  - platform: goodnature_ble
    mac_address: "D3:58:7F:15:99:0B"  # Your trap's MAC address
    kill_count:
      name: "Front Yard Trap Kill Count"
      id: front_yard_kill_count
    # battery_level and last_activation require GATT connection (not yet implemented)
    # battery_level:
    #   name: "Front Yard Trap Battery"
    # last_activation:
    #   name: "Front Yard Trap Last Activation"

# Example for a second trap (optional)
#  - platform: goodnature_ble
#    mac_address: "D7:AC:E9:XX:XX:XX"
#    kill_count:
#      name: "Back Yard Trap Kill Count"
#      id: back_yard_kill_count

