esphome:
  name: goodnature_test
  platform: ESP32
  board: esp32dev

wifi:
  ssid: "Your_WiFi_SSID"
  password: "Your_WiFi_Password"

api:
ota:

logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: DEBUG
    ble_client: DEBUG

# Enable BLE tracking to see when device broadcasts
esp32_ble_tracker:

# BLE Client for testing calm commands
ble_client:
  - mac_address: D3:58:7F:15:99:0B
    id: test_trap
    auto_connect: false  # Manual control
    on_connect:
      then:
        - logger.log: "✅ Connected to trap!"
    on_disconnect:
      then:
        - logger.log: "❌ Disconnected from trap"

# Test buttons to discover the calm command
button:
  # Test 1: Write 0x00 to kill data characteristic (0xD30D)
  - platform: template
    name: "Test 1: Write 0x00 to D30D"
    on_press:
      - logger.log: "TEST 1: Connecting..."
      - ble_client.connect: test_trap
      - delay: 2s
      - logger.log: "TEST 1: Writing 0x00 to characteristic D30D..."
      - ble_client.ble_write:
          id: test_trap
          service_uuid: '0000D00D-1212-EFDE-1523-785FEF13D123'
          characteristic_uuid: '0000D30D-1212-EFDE-1523-785FEF13D123'
          value: [0x00]
      - delay: 1s
      - logger.log: "TEST 1: Disconnecting..."
      - ble_client.disconnect: test_trap
      - delay: 5s
      - logger.log: "TEST 1: Check if device 'GN' still appears in BLE scan!"

  # Test 2: Write 0x01 to kill data characteristic (0xD30D)
  - platform: template
    name: "Test 2: Write 0x01 to D30D"
    on_press:
      - logger.log: "TEST 2: Connecting..."
      - ble_client.connect: test_trap
      - delay: 2s
      - logger.log: "TEST 2: Writing 0x01 to characteristic D30D..."
      - ble_client.ble_write:
          id: test_trap
          service_uuid: '0000D00D-1212-EFDE-1523-785FEF13D123'
          characteristic_uuid: '0000D30D-1212-EFDE-1523-785FEF13D123'
          value: [0x01]
      - delay: 1s
      - logger.log: "TEST 2: Disconnecting..."
      - ble_client.disconnect: test_trap
      - delay: 5s
      - logger.log: "TEST 2: Check if device 'GN' still appears in BLE scan!"

  # Test 3: Write 0x00 to test strike characteristic (0xD20D)
  - platform: template
    name: "Test 3: Write 0x00 to D20D (Test Strike)"
    on_press:
      - logger.log: "TEST 3: Connecting..."
      - ble_client.connect: test_trap
      - delay: 2s
      - logger.log: "TEST 3: Writing 0x00 to characteristic D20D (Test Strike)..."
      - ble_client.ble_write:
          id: test_trap
          service_uuid: '0000D00D-1212-EFDE-1523-785FEF13D123'
          characteristic_uuid: '0000D20D-1212-EFDE-1523-785FEF13D123'
          value: [0x00]
      - delay: 1s
      - logger.log: "TEST 3: Disconnecting..."
      - ble_client.disconnect: test_trap
      - delay: 5s
      - logger.log: "TEST 3: Check if device 'GN' still appears in BLE scan!"

  # Test 4: Write 0x01 to test strike characteristic (0xD20D)
  - platform: template
    name: "Test 4: Write 0x01 to D20D (Test Strike)"
    on_press:
      - logger.log: "TEST 4: Connecting..."
      - ble_client.connect: test_trap
      - delay: 2s
      - logger.log: "TEST 4: Writing 0x01 to characteristic D20D (Test Strike)..."
      - ble_client.ble_write:
          id: test_trap
          service_uuid: '0000D00D-1212-EFDE-1523-785FEF13D123'
          characteristic_uuid: '0000D20D-1212-EFDE-1523-785FEF13D123'
          value: [0x01]
      - delay: 1s
      - logger.log: "TEST 4: Disconnecting..."
      - ble_client.disconnect: test_trap
      - delay: 5s
      - logger.log: "TEST 4: Check if device 'GN' still appears in BLE scan!"

  # Test 5: Just connect and read, then disconnect (maybe that's all it takes?)
  - platform: template
    name: "Test 5: Just Connect & Read D30D"
    on_press:
      - logger.log: "TEST 5: Connecting..."
      - ble_client.connect: test_trap
      - delay: 2s
      - logger.log: "TEST 5: Just connected, not writing anything..."
      - logger.log: "TEST 5: (Reading happens automatically on connect if notifications enabled)"
      - delay: 2s
      - logger.log: "TEST 5: Disconnecting..."
      - ble_client.disconnect: test_trap
      - delay: 5s
      - logger.log: "TEST 5: Check if device 'GN' still appears in BLE scan!"

  # Test 6: Write 0xFF to D30D
  - platform: template
    name: "Test 6: Write 0xFF to D30D"
    on_press:
      - logger.log: "TEST 6: Connecting..."
      - ble_client.connect: test_trap
      - delay: 2s
      - logger.log: "TEST 6: Writing 0xFF to characteristic D30D..."
      - ble_client.ble_write:
          id: test_trap
          service_uuid: '0000D00D-1212-EFDE-1523-785FEF13D123'
          characteristic_uuid: '0000D30D-1212-EFDE-1523-785FEF13D123'
          value: [0xFF]
      - delay: 1s
      - logger.log: "TEST 6: Disconnecting..."
      - ble_client.disconnect: test_trap
      - delay: 5s
      - logger.log: "TEST 6: Check if device 'GN' still appears in BLE scan!"

  # Test 7: Write to FAD2 (usually 0 or 1, might be status/control)
  - platform: template
    name: "Test 7: Write 0x00 to FAD2"
    on_press:
      - logger.log: "TEST 7: Connecting..."
      - ble_client.connect: test_trap
      - delay: 2s
      - logger.log: "TEST 7: Writing 0x00 to characteristic FAD2..."
      - ble_client.ble_write:
          id: test_trap
          service_uuid: '0000FADE-1212-EFDE-1523-785FEF13D123'
          characteristic_uuid: '0000FAD2-1212-EFDE-1523-785FEF13D123'
          value: [0x00]
      - delay: 1s
      - logger.log: "TEST 7: Disconnecting..."
      - ble_client.disconnect: test_trap
      - delay: 5s
      - logger.log: "TEST 7: Check if device 'GN' still appears in BLE scan!"

  # Test 8: Empty write (some devices need this)
  - platform: template
    name: "Test 8: Empty Write to D20D"
    on_press:
      - logger.log: "TEST 8: Connecting..."
      - ble_client.connect: test_trap
      - delay: 2s
      - logger.log: "TEST 8: Writing empty array to characteristic D20D..."
      - ble_client.ble_write:
          id: test_trap
          service_uuid: '0000D00D-1212-EFDE-1523-785FEF13D123'
          characteristic_uuid: '0000D20D-1212-EFDE-1523-785FEF13D123'
          value: []
      - delay: 1s
      - logger.log: "TEST 8: Disconnecting..."
      - ble_client.disconnect: test_trap
      - delay: 5s
      - logger.log: "TEST 8: Check if device 'GN' still appears in BLE scan!"

  # Manual connect button for ad-hoc testing
  - platform: template
    name: "Manual Connect"
    on_press:
      - logger.log: "Manually connecting to trap..."
      - ble_client.connect: test_trap

  # Manual disconnect button
  - platform: template
    name: "Manual Disconnect"
    on_press:
      - logger.log: "Manually disconnecting from trap..."
      - ble_client.disconnect: test_trap

# Binary sensor to monitor if trap is broadcasting
binary_sensor:
  - platform: ble_presence
    mac_address: D3:58:7F:15:99:0B
    name: "Trap Is Broadcasting"
    id: trap_broadcasting

# Text sensor to show BLE scan results
text_sensor:
  - platform: template
    name: "Test Status"
    id: test_status
    update_interval: 5s
    lambda: |-
      if (id(trap_broadcasting).state) {
        return {"Trap is BROADCASTING (not calmed)"};
      } else {
        return {"Trap is NOT broadcasting (calmed or inactive)"};
      }
